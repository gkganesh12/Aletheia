<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinkedIn Personal Banner — Ganesh Khetawat</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .banner {
    width: 1584px;
    height: 396px;
    background: #09090b;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Dot grid */
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.02;
    background-image: radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* Glow center */
  .glow {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(139, 92, 246, 0.07), transparent 70%);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    /* Nudge right slightly so profile pic on left doesn't overlap */
    margin-left: 120px;
  }

  .name {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 64px;
    color: #ffffff;
    letter-spacing: -0.035em;
    line-height: 1;
  }

  .name .gradient {
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    font-size: 22px;
    color: rgba(255,255,255,0.4);
    margin-top: 14px;
  }

  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .meta .dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(139, 92, 246, 0.5);
  }

  /* Bottom accent */
  .bottom-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 20%, #8b5cf6, #6366f1, #06b6d4, transparent 80%);
  }
</style>
</head>
<body style="background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<div class="banner">
  <div class="glow"></div>

  <div class="content">
    <div class="name">
      Ganesh <span class="gradient">Khetawat</span>
    </div>
    <div class="tagline">I build what others pitch.</div>
    <div class="meta">
      <span>Founder — Aletheia AI</span>
      <span class="dot"></span>
      <span>AI / Full-Stack / Cybersecurity</span>
      <span class="dot"></span>
      <span>aletheiaai.tech</span>
    </div>
  </div>

  <div class="bottom-line"></div>
</div>

</body>
</html>

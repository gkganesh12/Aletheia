<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shot · Signet</title>
<link rel="stylesheet" href="shots.css" />
<style>
  .strip { position: absolute; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, .16), 0 3px 6px rgba(0, 0, 0, .3), 0 44px 70px -18px rgba(0, 0, 0, .75), 0 90px 120px -40px rgba(0, 0, 0, .6); }
  .strip img { display: block; width: 100%; }
</style>
</head>
<body>
<!-- Captures of the scanner's landing page running locally; the strip is its own printed benchmark run. -->
<div class="board" style="--mat: var(--night); --key: .12">
  <div class="win" style="left: 84px; top: 124px; width: 1150px; rotate: -1.6deg;">
    <div class="win__bar"><i></i><i></i><i></i><span class="win__url">Signet</span></div>
    <img src="src/signet-site.webp" alt="" />
  </div>
  <div class="strip" style="right: 64px; bottom: 132px; width: 900px; rotate: 2.4deg;">
    <img src="src/signet-bench.webp" alt="" />
  </div>
</div>
</body>
</html>

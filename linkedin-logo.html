<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinkedIn Logo — Aletheia AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .logo {
    width: 300px;
    height: 300px;
    background: #09090b;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .logo svg {
    width: 180px;
    height: 180px;
  }
</style>
</head>
<body style="background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<div class="logo">
  <svg viewBox="0 0 32 32">
    <defs>
      <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
    </defs>
    <path d="M16 1 L3 6 L3 15 C3 22.5 8.5 29 16 31 C23.5 29 29 22.5 29 15 L29 6 Z" fill="#09090b" stroke="url(#grad)" stroke-width="1.2" opacity="0.95"/>
    <path d="M16 7 L9 24 L12.5 24 L14 20 L18 20 L19.5 24 L23 24 L16 7 Z M15 17.5 L16 13.5 L17 17.5 Z" fill="url(#grad)"/>
    <circle cx="16" cy="10" r="1.2" fill="#8b5cf6" opacity="0.8"/>
  </svg>
</div>

</body>
</html>
